<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoogle</title>
  <meta name="description" content="Search anything, any website. A Google-inspired search engine.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='13' r='9' fill='none' stroke='%234285F4' stroke-width='4'/%3E%3Cline x1='20' y1='20' x2='29' y2='29' stroke='%23EA4335' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ============================ HOME VIEW ============================ -->
  <div id="home-view" class="home-view" hidden>
    <header class="home-top">
      <div class="home-top-left">
        <button class="link-btn" data-home-link="about">About</button>
        <button class="link-btn" data-home-link="apps">Apps</button>
      </div>
      <div class="home-top-right">
        <button id="theme-toggle-home" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <a class="link-btn" href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      </div>
    </header>

    <main class="home-main">
      <div class="logo logo-xl" id="home-logo" aria-label="Zoogle">
        <span class="b">Z</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
      </div>
      <div class="search-wrap home-search-wrap">
        <div class="search-box" id="home-search-box">
          <svg class="sb-icon" viewBox="0 0 24 24"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="home-input" placeholder="Search anything, any website" autocomplete="off"
                 spellcheck="false" aria-label="Search">
          <button class="sb-clear" id="home-clear" title="Clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24"><path fill="#70757a" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <svg class="sb-mic" viewBox="0 0 24 24" id="home-mic" title="Search by voice"><path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
          <div class="suggest-dropdown" id="home-suggest" hidden></div>
        </div>
      </div>
      <div class="home-buttons">
        <button class="pill-btn" id="home-search-btn">Zoogle Search</button>
        <button class="pill-btn" id="home-lucky-btn">I'm Feeling Lucky</button>
      </div>
      <div class="home-hint">Try: <button class="link-btn chip" data-example="weather tomorrow">weather tomorrow</button> ·
        <button class="link-btn chip" data-example="open source search engine">open source search engine</button> ·
        <button class="link-btn chip" data-example="site:wikipedia.org quantum physics">site:wikipedia.org quantum physics</button>
      </div>
    </main>

    <footer class="home-footer">
      <div class="home-footer-country">Zoogle — searching the live web via Bing · images via Openverse · news via Google News · facts via Wikipedia</div>
    </footer>
  </div>

  <!-- ========================== RESULTS VIEW =========================== -->
  <div id="results-view" hidden>
    <div class="results-header-wrap">
      <header class="results-header">
        <a class="results-logo" href="/" id="results-logo" aria-label="Zoogle home">
          <span class="b">Z</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
        </a>
        <div class="search-wrap results-search-wrap">
          <div class="search-box" id="results-search-box">
            <svg class="sb-icon" viewBox="0 0 24 24"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="results-input" autocomplete="off" spellcheck="false" aria-label="Search">
            <button class="sb-clear" id="results-clear" title="Clear" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24"><path fill="#70757a" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <button class="sb-search-btn" id="results-search-btn" title="Search" aria-label="Search">
              <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <div class="suggest-dropdown" id="results-suggest" hidden></div>
          </div>
        </div>
        <button id="theme-toggle-results" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      </header>
      <nav class="results-tabs" id="results-tabs">
        <button class="tab-btn active" data-tab="web">
          <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>All</button>
        <button class="tab-btn" data-tab="isch">
          <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Images</button>
        <button class="tab-btn" data-tab="nws">
          <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H4V8h16v10zm-2-7h-5v5h5v-5z"/></svg>News</button>
      </nav>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <main class="results-layout" id="results-layout">
      <section class="results-main" id="results-main" aria-live="polite"></section>
      <aside class="knowledge-panel" id="knowledge-panel"></aside>
    </main>
    <div class="results-footer-pad"></div>
    <footer class="results-footer">
      <span>Results from the live web · Bing index · <span id="footer-time"></span></span>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/js/app.js"></script>
</body>
</html>
